version: "3.9"

services:
  db:
    image: postgres:16
    container_name: bills-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bills_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: bills-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/bills_db
      - SECRET_KEY=une_clé_secrète_jwt_très_longue_et_aléatoire
      - ENVIRONMENT=development
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:8081,http://172.20.10.3:3000
    depends_on:
      - db
    volumes:
      - ./app:/app/app  # Pour le rechargement à chaud

volumes:
  pgdata:
